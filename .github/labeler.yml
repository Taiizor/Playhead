# Configuration for PR Labeler

core:
    - changed-files:
          - any-glob-to-any-file:
                - src/**

documentation:
    - changed-files:
          - any-glob-to-any-file:
                - "*.md"
                - docs/**

tests:
    - changed-files:
          - any-glob-to-any-file:
                - tests/**

samples:
    - changed-files:
          - any-glob-to-any-file:
                - samples/**

ci:
    - changed-files:
          - any-glob-to-any-file:
                - .github/**